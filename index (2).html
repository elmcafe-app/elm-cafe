  } catch { return iso; }
}
function relTime(iso) {
  const diff = (Date.now() - new Date(iso).getTime()) / 1000;
  if (diff < 60) return "الآن";
  if (diff < 3600) return `منذ ${Math.floor(diff / 60)} دقيقة`;
  if (diff < 86400) return `منذ ${Math.floor(diff / 3600)} ساعة`;
  return `منذ ${Math.floor(diff / 86400)} يوم`;
}

/* ============================= مكوّنات عامة ============================= */
function Logo({ size = 32 }) {
  return <img src={LOGO_SRC} alt="Elm Cafe" style={{ width: size, height: "auto", display: "block" }} />;
}
function TopBar({ title, onBack, session, onLogout, onRefresh, refreshing }) {
  return (
    <div style={s.topbar}>
      <div style={{ display: "flex", alignItems: "center", gap: 10, minWidth: 0 }}>
        {onBack ? (
          <button onClick={onBack} style={s.iconBtn} aria-label="رجوع"><Icon path={ICONS.back} rotate={180} /></button>
        ) : <Logo size={28} />}
        <div style={{ fontSize: 16, fontWeight: 700, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{title}</div>
      </div>
      <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
        {onRefresh && <button onClick={onRefresh} style={s.iconBtn}><span className={refreshing ? "spin" : ""}><Icon path={ICONS.refresh} size={17} /></span></button>}
        {session && <button onClick={onLogout} style={s.iconBtn}><Icon path={ICONS.logout} size={17} /></button>}
      </div>
    </div>
  );
}
function ScoreRing({ score, size = 148 }) {
  const r = (size - 14) / 2, c = 2 * Math.PI * r, pct = Math.max(0, Math.min(100, score));
  const offset = c - (pct / 100) * c;
  const color = pct >= 90 ? "var(--gold)" : pct >= 70 ? "var(--green)" : pct >= 60 ? "#B9862F" : "var(--red)";
  return (
    <div style={{ position: "relative", width: size, height: size }}>
      <svg width={size} height={size} style={{ transform: "rotate(-90deg)" }}>
        <circle cx={size/2} cy={size/2} r={r} stroke="var(--border)" strokeWidth="10" fill="none" />
        <circle cx={size/2} cy={size/2} r={r} stroke={color} strokeWidth="10" fill="none"
          strokeDasharray={c} strokeDashoffset={offset} strokeLinecap="round" style={{ transition: "stroke-dashoffset .6s ease" }} />
      </svg>
      <div style={{ position: "absolute", inset: 0, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center" }}>
        <div style={{ fontSize: 34, fontWeight: 800, lineHeight: 1 }}>{Math.round(pct)}</div>
        <div style={{ fontSize: 12, color: "var(--ink-3)", marginTop: 2 }}>من 100</div>
      </div>
    </div>
  );
}
function Modal({ title, children, onClose, footer }) {
  return (
    <div style={s.modalOverlay} onClick={onClose}>
      <div style={s.modalCard} onClick={(e) => e.stopPropagation()}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
          <div style={{ fontSize: 17, fontWeight: 700 }}>{title}</div>
          <button onClick={onClose} style={s.iconBtn}><Icon path={ICONS.x} size={17} /></button>
        </div>
        <div>{children}</div>
        {footer && <div style={{ marginTop: 18, display: "flex", gap: 8 }}>{footer}</div>}
      </div>
    </div>
  );
}
function Toast({ toast }) {
  if (!toast) return null;
  return <div style={{ ...s.toast, ...(toast.type === "error" ? { background: "var(--red)" } : toast.type === "warn" ? { background: "#B9862F" } : {}) }}>{toast.msg}</div>;
}
function Field({ label, children }) {
  return <div style={{ marginBottom: 14 }}><label style={{ display: "block", fontSize: 13, color: "var(--ink-2)", marginBottom: 6 }}>{label}</label>{children}</div>;
}
function Btn({ children, onClick, variant = "secondary", disabled, style, type = "button" }) {
  const base = { ...s.btn, ...(variant === "primary" ? s.btnPrimary : variant === "danger" ? s.btnDanger : variant === "ghost" ? s.btnGhost : {}) };
  return <button type={type} onClick={onClick} disabled={disabled} style={{ ...base, ...(disabled ? { opacity: 0.5, cursor: "not-allowed" } : {}), ...style }}>{children}</button>;
}
function EmptyState({ icon, title, body }) {

}

/* ============================= طبقة البيانات (Supabase) ============================= */

async function fetchAll() {
  const [emp, cat, cyc, ev, aud, rb] = await Promise.all([
    supabase.from("employees").select("*").order("name"),
    supabase.from("categories").select("*"),
    supabase.from("cycles").select("*").order("created_at", { ascending: false }),
    supabase.from("evaluations").select("*").order("created_at", { ascending: false }),
    supabase.from("audit_log").select("*").order("created_at", { ascending: false }).limit(80),
    supabase.from("rating_bands").select("*").order("sort_order"),
  ]);
  return {
    employees: emp.data || [], categories: cat.data || [], cycles: cyc.data || [],
    evaluations: ev.data || [], audit: aud.data || [], ratingBands: (rb.data && rb.data.length) ? rb.data : DEFAULT_RATING_BANDS_FALLBACK,
  };
}
async function fetchProfiles() {
  const { data } = await supabase.from("profiles").select("*").order("created_at");
  return data || [];
}

/* ============================= التطبيق ============================= */

function App() {
  const [booting, setBooting] = useState(true);
  const [session, setSession] = useState(null); // {id, name, role, active, email}
  const [screen, setScreen] = useState("login");
  const [stack, setStack] = useState([]);
  const [ctx, setCtx] = useState({});
  const [toast, setToast] = useState(null);
  const [refreshing, setRefreshing] = useState(false);
  const [pendingNav, setPendingNav] = useState(null);
  const hasUnsavedRef = useRef(false);

  const [employees, setEmployees] = useState([]);
  const [categories, setCategories] = useState([]);
  const [cycles, setCycles] = useState([]);
  const [evaluations, setEvaluations] = useState([]);
  const [audit, setAudit] = useState([]);
  const [ratingBands, setRatingBands] = useState(DEFAULT_RATING_BANDS_FALLBACK);
  const [profiles, setProfiles] = useState([]);

  const showToast = useCallback((msg, type = "ok") => { setToast({ msg, type }); setTimeout(() => setToast(null), 2600); }, []);

  async function refetch() {
    const d = await fetchAll();
    setEmployees(d.employees); setCategories(d.categories); setCycles(d.cycles);
    setEvaluations(d.evaluations); setAudit(d.audit); setRatingBands(d.ratingBands);
  }
  async function refetchProfiles() { setProfiles(await fetchProfiles()); }

  async function loadSessionProfile(authUser) {
    const { data: prof } = await supabase.from("profiles").select("*").eq("id", authUser.id).single();
    if (!prof) return null;
    if (!prof.active) { await supabase.auth.signOut(); showToast("هذا الحساب معطّل. راجع المدير الأعلى", "error"); return null; }
    return { id: prof.id, name: prof.name, role: prof.role, active: prof.active, email: authUser.email };
  }

  useEffect(() => {
    (async () => {
      const { data: { session: authSession } } = await supabase.auth.getSession();
      if (authSession) {
        const prof = await loadSessionProfile(authSession.user);
        if (prof) {
          setSession(prof);
          await refetch(); await refetchProfiles();
          setScreen(prof.role === "super_admin" ? "adminHome" : "home");
        }
      }
      setBooting(false);
    })();
  }, []);

  // اشتراكات لحظية حقيقية
  useEffect(() => {
    if (!session) return;
    const channel = supabase.channel("elm-realtime")
      .on("postgres_changes", { event: "*", schema: "public", table: "evaluations" }, refetch)
      .on("postgres_changes", { event: "*", schema: "public", table: "employees" }, refetch)
      .on("postgres_changes", { event: "*", schema: "public", table: "categories" }, refetch)
      .on("postgres_changes", { event: "*", schema: "public", table: "cycles" }, refetch)
      .on("postgres_changes", { event: "*", schema: "public", table: "rating_bands" }, refetch)
      .on("postgres_changes", { event: "*", schema: "public", table: "audit_log" }, refetch)
      .on("postgres_changes", { event: "*", schema: "public", table: "profiles" }, refetchProfiles)
      .subscribe();
    return () => { supabase.removeChannel(channel); };
  }, [session]);

  async function manualRefresh() { setRefreshing(true); await refetch(); await refetchProfiles(); setTimeout(() => setRefreshing(false), 400); }

  async function addAudit(action, target, details = "") {
    await supabase.from("audit_log").insert({ actor: session ? session.name : "النظام", action, target, details });
  }

  function goto(next, nextCtx = {}) {
    const doNav = () => { setStack((s2) => [...s2, { screen, ctx }]); setCtx(nextCtx); setScreen(next); hasUnsavedRef.current = false; };
    if (screen === "newEval" && hasUnsavedRef.current) setPendingNav(() => doNav); else doNav();
  }
  function goBack() {
    const doNav = () => { setStack((s2) => { if (!s2.length) return s2; const last = s2[s2.length - 1]; setCtx(last.ctx); setScreen(last.screen); return s2.slice(0, -1); }); hasUnsavedRef.current = false; };
    if (screen === "newEval" && hasUnsavedRef.current) setPendingNav(() => doNav); else doNav();
  }
  async function logout() { await supabase.auth.signOut(); setSession(null); setStack([]); setCtx({}); setScreen("login"); }

  const activeCycle = cycles.find((c) => c.status === "active");
  function computeScore(employeeId, cycleId) {
    const evs = evaluations.filter((e) => e.employee_id === employeeId && e.cycle_id === cycleId && e.status === "active");
    let delta = 0;
    evs.forEach((e) => { delta += e.type === "positive" ? e.category_points : -e.category_points; });
    return Math.max(0, Math.min(100, 100 + delta));
  }
  function ratingFor(score) {
    const b = ratingBands.find((b) => score >= b.min && score <= b.max);
    return b ? b.label : "-";
  }

  if (booting) return <div style={{ display: "flex", alignItems: "center", justifyContent: "center", minHeight: "100vh", color: "var(--ink-3)" }}>جارِ التحميل…</div>;

  return (
    <div dir="rtl">
      {!session && (
        <LoginScreen
          onLogin={async (username, password) => {
            const email = `${username.trim()}@${EMAIL_DOMAIN}`;
            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) return "بيانات الدخول غير صحيحة";
            const prof = await loadSessionProfile(data.user);
            if (!prof) return "الحساب غير مفعّل أو غير موجود";
            setSession(prof); await refetch(); await refetchProfiles();
            setScreen(prof.role === "super_admin" ? "adminHome" : "home");
            await supabase.from("audit_log").insert({ actor: prof.name, action: "تسجيل دخول", target: "-" });
            return null;
          }}
          onReset={async (username) => {
            const email = `${username.trim()}@${EMAIL_DOMAIN}`;
            await supabase.auth.resetPasswordForEmail(email);
          }}
        />
      )}

      {session && (
        <>
          <TopBar title={titleFor(screen, ctx, employees)} onBack={stack.length ? goBack : null} session={session} onLogout={logout} onRefresh={manualRefresh} refreshing={refreshing} />
          <div style={s.body}>

            {screen === "home" && (
              <EvaluatorHome employees={employees.filter((e) => !e.archived)} activeCycle={activeCycle} computeScore={computeScore}
                onOpen={(emp) => goto("employee", { employeeId: emp.id })} />
            )}

            {screen === "employee" && (
              <EmployeeDetail employee={employees.find((e) => e.id === ctx.employeeId)} activeCycle={activeCycle}
                evaluations={evaluations} computeScore={computeScore} ratingFor={ratingFor}
                onNewEval={() => goto("newEval", { employeeId: ctx.employeeId })}
                onHistory={() => goto("history", { employeeId: ctx.employeeId })} />
            )}

            {screen === "newEval" && (
              <NewEvaluationScreen employee={employees.find((e) => e.id === ctx.employeeId)}
                categories={categories.filter((c) => c.active)} activeCycle={activeCycle} session={session} hasUnsavedRef={hasUnsavedRef}
                onDone={async (rec) => {
                  const { error } = await supabase.from("evaluations").insert(rec);
                  if (error) { showToast("حدث خطأ أثناء الحفظ. لم يتم فقدان المسودة.", "error"); return; }
                  await addAudit("إضافة تقييم", `${rec.employee_name} — ${rec.category_name}`);
                  showToast("تم حفظ التقييم"); goBack();
                }} />
            )}

            {screen === "history" && (
              <HistoryScreen employee={employees.find((e) => e.id === ctx.employeeId)}
                evaluations={evaluations.filter((e) => e.employee_id === ctx.employeeId)} session={session}
                onCancel={async (evId, reason) => {
                  await supabase.from("evaluations").update({ status: "cancelled", edited_by: session.name, edited_at: nowISO(), cancel_reason: reason }).eq("id", evId);
                  await addAudit("إلغاء تقييم", evId, reason || "");
                  showToast("تم إلغاء التقييم");
                }} />
            )}

            {screen === "adminHome" && (
              <AdminDashboard employees={employees} profiles={profiles} evaluations={evaluations} activeCycle={activeCycle}
                computeScore={computeScore} audit={audit} onGo={(scr) => goto(scr)} />
            )}

            {screen === "adminEmployees" && (
              <AdminEmployees employees={employees}
                onAdd={async (emp) => {
                  const { error } = await supabase.from("employees").insert(emp);
                  if (error) { showToast("رقم الموظف مستخدم من قبل أو حدث خطأ", "error"); return false; }
                  await addAudit("إضافة موظف", emp.name); showToast("تمت إضافة الموظف"); return true;
                }}
                onArchive={async (id, archived) => {
                  await supabase.from("employees").update({ archived }).eq("id", id);
                  await addAudit(archived ? "أرشفة موظف" : "إعادة تفعيل موظف", id);
                  showToast(archived ? "تمت الأرشفة" : "تمت إعادة التفعيل");
                }} />
            )}

            {screen === "adminUsers" && (
              <AdminUsers profiles={profiles}
                onAdd={async (u) => {
                  const email = `${u.username.trim()}@${EMAIL_DOMAIN}`;
                  const tempClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: false, autoRefreshToken: false } });
                  const { data, error } = await tempClient.auth.signUp({ email, password: u.password });
                  if (error || !data.user) { showToast(error?.message?.includes("already") ? "اسم المستخدم مستخدم من قبل" : "حدث خطأ أثناء الإنشاء", "error"); return false; }
                  const { error: profErr } = await supabase.from("profiles").insert({ id: data.user.id, name: u.name, role: u.role, active: true });
                  if (profErr) { showToast("حدث خطأ أثناء إنشاء الملف الشخصي", "error"); return false; }
                  await addAudit("إنشاء مستخدم", u.name); await refetchProfiles();
                  showToast("تم إنشاء المستخدم"); return true;
                }}
                onToggle={async (id, active) => {
                  await supabase.from("profiles").update({ active }).eq("id", id);
                  await addAudit(active ? "تفعيل مستخدم" : "تعطيل مستخدم", id);
                  showToast(active ? "تم التفعيل" : "تم التعطيل");
                }} />
            )}

            {screen === "adminCategories" && (
              <AdminCategories categories={categories} ratingBands={ratingBands}
                onAddCategory={async (cat) => { await supabase.from("categories").insert(cat); await addAudit("إضافة تصنيف تقييم", cat.name); showToast("تمت إضافة التصنيف"); }}
                onUpdateCategory={async (id, patch) => { await supabase.from("categories").update(patch).eq("id", id); await addAudit("تعديل تصنيف تقييم", id, JSON.stringify(patch)); showToast("تم التحديث — لن يؤثر على التقييمات السابقة"); }}
                onUpdateBands={async (bands) => {
                  await supabase.from("rating_bands").delete().neq("id", "00000000-0000-0000-0000-000000000000");
                  await supabase.from("rating_bands").insert(bands.map((b, i) => ({ min: b.min, max: b.max, label: b.label, sort_order: i })));
                  await addAudit("تعديل نطاقات التقييم", "-"); showToast("تم تحديث نطاقات التقييم");
                }} />
            )}

            {screen === "adminCycles" && (
              <AdminCycles cycles={cycles}
                onCreate={async (cy) => {
                  if (cycles.some((c) => c.status === "active")) { showToast("يوجد بالفعل دورة نشطة", "error"); return false; }
                  const { error } = await supabase.from("cycles").insert(cy);
                  if (error) { showToast("حدث خطأ", "error"); return false; }
                  await addAudit("إنشاء دورة تقييم", cy.name); showToast("تم إنشاء الدورة وتفعيلها"); return true;
                }}
                onClose={async (id) => { await supabase.from("cycles").update({ status: "closed" }).eq("id", id); await addAudit("إغلاق دورة تقييم", id); showToast("تم إغلاق الدورة"); }}
                onReopen={async (id) => { await supabase.from("cycles").update({ status: "active" }).eq("id", id); await addAudit("إعادة فتح دورة تقييم", id); showToast("تم إعادة فتح الدورة"); }}
                onCancel={async (id) => { await supabase.from("cycles").update({ status: "cancelled" }).eq("id", id); await addAudit("إلغاء دورة تقييم", id); showToast("تم إلغاء الدورة"); }} />
            )}

            {screen === "reportsOverall" && (
              <ReportsOverall employees={employees.filter((e) => !e.archived)} cycles={cycles} evaluations={evaluations}
                computeScore={computeScore} ratingFor={ratingFor} onOpenEmployee={(id) => goto("employee", { employeeId: id })} />
            )}

            {screen === "auditLog" && <AuditLogScreen audit={audit} />}
          </div>
        </>
      )}

      <Toast toast={toast} />
      {pendingNav && (
        <Modal title="لديك تغييرات غير محفوظة" onClose={() => setPendingNav(null)} footer={<>
          <Btn variant="danger" onClick={() => { const f = pendingNav; setPendingNav(null); f(); }}>نعم، خروج بدون حفظ</Btn>
          <Btn variant="ghost" onClick={() => setPendingNav(null)}>لا، البقاء وإكمال التقييم</Btn>
        </>}>
          <div style={{ fontSize: 14, color: "var(--ink-2)" }}>هل تريد الخروج بدون حفظ التقييم الحالي؟ ستبقى المسودة محفوظة على هذا الجهاز لو رجعت لاحقًا.</div>
        </Modal>
      )}
    </div>
  );
}

function titleFor(screen, ctx, employees) {
  const emp = employees.find((e) => e.id === ctx.employeeId);
  switch (screen) {
    case "home": return "الموظفون"; case "employee": return emp ? emp.name : "الموظف";
    case "newEval": return "تقييم جديد"; case "history": return "سجل التقييمات";

}

/* ============================= تقييم جديد ============================= */
function NewEvaluationScreen({ employee, categories, activeCycle, session, hasUnsavedRef, onDone }) {
  const draftKey = `elm_draft_${session.id}_${employee?.id}`;
  const [category, setCategory] = useState(null); const [note, setNote] = useState("");
  const [saving, setSaving] = useState(false); const savingLock = useRef(false); const [restored, setRestored] = useState(false);

  useEffect(() => {
    try {
      const raw = localStorage.getItem(draftKey);
      if (raw) { const d = JSON.parse(raw); setCategory(d.category || null); setNote(d.note || ""); setRestored(true); setTimeout(() => setRestored(false), 3000); }
    } catch {}
  }, []);
  useEffect(() => {
    hasUnsavedRef.current = !!category || !!note.trim();
    try { if (category || note.trim()) localStorage.setItem(draftKey, JSON.stringify({ category, note })); } catch {}
  }, [category, note]);

  if (!employee) return <EmptyState icon={<Icon path={ICONS.users} size={28} />} title="الموظف غير موجود" body="" />;
  if (!activeCycle) return <EmptyState icon={<Icon path={ICONS.warn} size={28} />} title="لا توجد دورة نشطة" body="لا يمكن إضافة تقييم بدون دورة تقييم نشطة." />;

  const negatives = categories.filter((c) => c.type === "negative"); const positives = categories.filter((c) => c.type === "positive");

  async function commit() {
    if (savingLock.current || !category) return;
    savingLock.current = true; setSaving(true);
    const rec = {
      employee_id: employee.id, employee_name: employee.name, category_id: category.id, category_name: category.name,
      type: category.type, category_points: category.points, note: note.trim(), evaluator_id: session.id, evaluator_name: session.name,
      cycle_id: activeCycle.id, status: "active",
    };
    try { localStorage.removeItem(draftKey); } catch {}
    hasUnsavedRef.current = false;
    await onDone(rec);
    setSaving(false); savingLock.current = false;
  }

  return (
    <div>
      {restored && <div style={s.infoBanner}>تم استرجاع مسودة تقييم غير مكتملة لهذا الموظف.</div>}
      <div style={{ fontSize: 13, color: "var(--ink-3)", marginBottom: 12 }}>الموظف: <b style={{ color: "var(--ink)" }}>{employee.name}</b></div>
      <div style={{ fontSize: 13, fontWeight: 700, color: "var(--ink-2)", marginBottom: 8 }}>تقييم سلبي</div>
      <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 16 }}>
        {negatives.map((c) => (
          <button key={c.id} onClick={() => setCategory(c)} style={{ ...s.catCard, ...(category?.id === c.id ? s.catCardActiveNeg : {}) }}>
            <span>{c.name}</span><span style={{ color: "var(--red)", fontWeight: 700 }}>-{c.points}</span>
          </button>
        ))}
      </div>
      <div style={{ fontSize: 13, fontWeight: 700, color: "var(--ink-2)", marginBottom: 8 }}>تقييم إيجابي</div>
      <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 16 }}>
        {positives.map((c) => (
          <button key={c.id} onClick={() => setCategory(c)} style={{ ...s.catCard, ...(category?.id === c.id ? s.catCardActivePos : {}) }}>
            <span>{c.name}</span><span style={{ color: "var(--green)", fontWeight: 700 }}>+{c.points}</span>
          </button>
        ))}
      </div>
      {category && (
        <Field label={category.type === "negative" ? "سبب التقييم (يُفضّل توضيحه)" : "ملاحظة (اختياري)"}>
          <textarea style={{ ...s.input, minHeight: 90, resize: "vertical" }} value={note} onChange={(e) => setNote(e.target.value)} placeholder="اكتب التفاصيل هنا…" />
        </Field>
      )}
      <div style={{ display: "flex", gap: 8, marginTop: 6 }}>
        <Btn variant="primary" style={{ flex: 1 }} disabled={!category || saving} onClick={commit}>{saving ? "جارِ الحفظ…" : "حفظ التقييم"}</Btn>
      </div>
    </div>
  );
}

  return (
    <div>
      <Btn variant="primary" style={{ width: "100%", marginBottom: 14 }} onClick={() => setOpen(true)}><Icon path={ICONS.plus} size={16} /> إضافة مستخدم</Btn>
      <div style={{ fontSize: 12, color: "var(--ink-3)", marginBottom: 12 }}>لإعادة تعيين كلمة مرور مستخدم: استخدم "نسيت كلمة المرور" في شاشة الدخول بنفس اسم المستخدم.</div>
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {profiles.map((u) => (
          <div key={u.id} style={{ ...s.rowCard, cursor: "default" }}>
            <div style={s.avatarCircle}>{u.name.slice(0, 1)}</div>
            <div style={{ flex: 1, textAlign: "right" }}>
              <div style={{ fontWeight: 700, fontSize: 14 }}>{u.name} {!u.active && <span style={{ color: "var(--red)", fontWeight: 400, fontSize: 12 }}>(معطّل)</span>}</div>
              <div style={{ fontSize: 12, color: "var(--ink-3)" }}>{u.role === "super_admin" ? "مدير أعلى" : "مقيّم"}</div>
            </div>
            {u.role !== "super_admin" && (
              <button onClick={() => onToggle(u.id, !u.active)} style={s.iconBtn}>
                <Icon path={u.active ? ICONS.unlock : ICONS.lock} size={15} color={u.active ? "var(--green)" : "var(--red)"} />
              </button>
            )}
          </div>
        ))}
      </div>
      {open && (
        <Modal title="إضافة مستخدم" onClose={() => setOpen(false)} footer={<><Btn variant="primary" onClick={submit}>حفظ</Btn><Btn variant="ghost" onClick={() => setOpen(false)}>إلغاء</Btn></>}>
          <Field label="الاسم"><input style={s.input} value={name} onChange={(e) => setName(e.target.value)} /></Field>
          <Field label="اسم المستخدم (بدون مسافات أو رموز)"><input style={s.input} value={username} onChange={(e) => setUsername(e.target.value.replace(/\s/g, ""))} /></Field>
          <Field label="كلمة المرور"><input type="password" style={s.input} value={password} onChange={(e) => setPassword(e.target.value)} /></Field>
          <Field label="الدور"><select style={s.input} value={role} onChange={(e) => setRole(e.target.value)}><option value="evaluator">مقيّم</option><option value="super_admin">مدير أعلى</option></select></Field>
          {err && <div style={s.errText}>{err}</div>}
        </Modal>
      )}
    </div>
  );
}

/* ============================= تصنيفات ونطاقات التقييم ============================= */
function AdminCategories({ categories, ratingBands, onAddCategory, onUpdateCategory, onUpdateBands }) {
  const [open, setOpen] = useState(false); const [name, setName] = useState(""); const [type, setType] = useState("negative"); const [points, setPoints] = useState(2);
  const [editPoints, setEditPoints] = useState({}); const [bands, setBands] = useState(ratingBands);
  useEffect(() => { setBands(ratingBands); }, [ratingBands]);
  async function submit(e) { e.preventDefault(); if (!name.trim() || !points) return; await onAddCategory({ name: name.trim(), type, points: Number(points), active: true }); setOpen(false); setName(""); setType("negative"); setPoints(2); }
  return (
    <div>
      <div style={{ fontSize: 13, fontWeight: 700, color: "var(--ink-2)", marginBottom: 8 }}>تصنيفات التقييم</div>
      <div style={{ fontSize: 12, color: "var(--ink-3)", marginBottom: 10 }}>تغيير النقاط يؤثر على التقييمات الجديدة فقط.</div>
      <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 14 }}>
        {categories.map((c) => (
          <div key={c.id} style={s.card}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <div><div style={{ fontWeight: 700, fontSize: 14 }}>{c.name} {!c.active && <span style={{ color: "var(--ink-3)", fontWeight: 400, fontSize: 12 }}>(معطّل)</span>}</div>
                <div style={{ fontSize: 12, color: c.type === "positive" ? "var(--green)" : "var(--red)" }}>{c.type === "positive" ? "إيجابي" : "سلبي"}</div></div>
              <button onClick={() => onUpdateCategory(c.id, { active: !c.active })} style={s.iconBtn}><Icon path={c.active ? ICONS.lock : ICONS.unlock} size={15} color={c.active ? "var(--ink-3)" : "var(--forest)"} /></button>
            </div>
            <div style={{ display: "flex", gap: 8, marginTop: 10, alignItems: "center" }}>
              <input type="number" min="1" style={{ ...s.input, width: 80 }} value={editPoints[c.id] ?? c.points} onChange={(e) => setEditPoints({ ...editPoints, [c.id]: e.target.value })} />
              <Btn onClick={() => onUpdateCategory(c.id, { points: Number(editPoints[c.id] ?? c.points) })}>تحديث النقاط</Btn>
            </div>
          </div>
        ))}
      </div>
      <Btn variant="primary" style={{ width: "100%", marginBottom: 20 }} onClick={() => setOpen(true)}><Icon path={ICONS.plus} size={16} /> إضافة تصنيف جديد</Btn>
      <div style={{ fontSize: 13, fontWeight: 700, color: "var(--ink-2)", marginBottom: 8 }}>نطاقات التقييم</div>
      <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 12 }}>
        {bands.map((b, i) => (
          <div key={i} style={{ display: "flex", gap: 6, alignItems: "center" }}>
            <input type="number" style={{ ...s.input, width: 60 }} value={b.min} onChange={(e) => { const nb = [...bands]; nb[i] = { ...b, min: Number(e.target.value) }; setBands(nb); }} />
            <span style={{ color: "var(--ink-3)" }}>—</span>
            <input type="number" style={{ ...s.input, width: 60 }} value={b.max} onChange={(e) => { const nb = [...bands]; nb[i] = { ...b, max: Number(e.target.value) }; setBands(nb); }} />
            <input style={{ ...s.input, flex: 1 }} value={b.label} onChange={(e) => { const nb = [...bands]; nb[i] = { ...b, label: e.target.value }; setBands(nb); }} />
          </div>
        ))}
      </div>
      <Btn onClick={() => onUpdateBands(bands)} style={{ width: "100%" }}>حفظ النطاقات</Btn>
      {open && (
        <Modal title="إضافة تصنيف" onClose={() => setOpen(false)} footer={<><Btn variant="primary" onClick={submit}>حفظ</Btn><Btn variant="ghost" onClick={() => setOpen(false)}>إلغاء</Btn></>}>
          <Field label="الاسم"><input style={s.input} value={name} onChange={(e) => setName(e.target.value)} /></Field>
          <Field label="النوع"><select style={s.input} value={type} onChange={(e) => setType(e.target.value)}><option value="negative">سلبي</option><option value="positive">إيجابي</option></select></Field>
          <Field label="عدد النقاط"><input type="number" min="1" style={s.input} value={points} onChange={(e) => setPoints(e.target.value)} /></Field>
        </Modal>
      )}
    </div>
  );
}

/* ============================= دورات التقييم ============================= */
function AdminCycles({ cycles, onCreate, onClose, onReopen, onCancel }) {
  const [open, setOpen] = useState(false); const [name, setName] = useState(""); const [start, setStart] = useState(""); const [end, setEnd] = useState(""); const [err, setErr] = useState("");
  async function submit(e) {
    e.preventDefault();
    if (!name.trim() || !start || !end) { setErr("املأ كل الحقول"); return; }
    if (new Date(end) < new Date(start)) { setErr("تاريخ النهاية قبل البداية"); return; }
    const ok = await onCreate({ name: name.trim(), start_date: start, end_date: end, status: "active" });
    if (ok !== false) { setOpen(false); setName(""); setStart(""); setEnd(""); setErr(""); }
  }
  const statusLabel = { active: "نشطة", closed: "مغلقة", cancelled: "ملغاة", draft: "مسودة" };
  const statusColor = { active: "var(--green)", closed: "var(--ink-3)", cancelled: "var(--red)", draft: "var(--ink-3)" };
  return (
    <div>
      <Btn variant="primary" style={{ width: "100%", marginBottom: 14 }} onClick={() => setOpen(true)}><Icon path={ICONS.plus} size={16} /> إنشاء دورة جديدة</Btn>
      {!cycles.length ? <EmptyState icon={<Icon path={ICONS.clock} size={28} />} title="لا توجد دورات" body="ابدأ أول دورة تقييم." /> : (
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {cycles.map((c) => (
            <div key={c.id} style={s.card}>
              <div style={{ display: "flex", justifyContent: "space-between" }}><div style={{ fontWeight: 700, fontSize: 14 }}>{c.name}</div><div style={{ fontSize: 12, fontWeight: 700, color: statusColor[c.status] }}>{statusLabel[c.status]}</div></div>
              <div style={{ fontSize: 12, color: "var(--ink-3)", margin: "4px 0 10px" }}>{fmtDate(c.start_date)} — {fmtDate(c.end_date)}</div>
              <div style={{ display: "flex", gap: 8 }}>
                {c.status === "active" && <Btn onClick={() => onClose(c.id)}><Icon path={ICONS.stop} size={14} /> إغلاق</Btn>}
                {c.status === "closed" && <Btn onClick={() => onReopen(c.id)}><Icon path={ICONS.rotate} size={14} /> إعادة فتح</Btn>}
                {c.status === "active" && <Btn variant="danger" onClick={() => onCancel(c.id)}>إلغاء الدورة</Btn>}
              </div>
            </div>
          ))}
        </div>
      )}
      {open && (
        <Modal title="إنشاء دورة تقييم" onClose={() => setOpen(false)} footer={<><Btn variant="primary" onClick={submit}>إنشاء وتفعيل</Btn><Btn variant="ghost" onClick={() => setOpen(false)}>إلغاء</Btn></>}>
          <Field label="اسم الدورة"><input style={s.input} value={name} onChange={(e) => setName(e.target.value)} placeholder="مثال: دورة الربع الأول 2027" /></Field>
          <Field label="تاريخ البداية"><input type="date" style={s.input} value={start} onChange={(e) => setStart(e.target.value)} /></Field>
          <Field label="تاريخ النهاية"><input type="date" style={s.input} value={end} onChange={(e) => setEnd(e.target.value)} /></Field>
          {err && <div style={s.errText}>{err}</div>}
        </Modal>
      )}
    </div>
  );
}

/* ============================= التقرير العام ============================= */
function ReportsOverall({ employees, cycles, evaluations, computeScore, ratingFor, onOpenEmployee }) {
  const [cycleId, setCycleId] = useState(cycles.find((c) => c.status === "active")?.id || cycles[0]?.id || "");
  useEffect(() => { if (!cycleId && cycles.length) setCycleId(cycles.find((c) => c.status === "active")?.id || cycles[0].id); }, [cycles]);
  const cycle = cycles.find((c) => c.id === cycleId);
  const rows = employees.map((e) => {
    const score = cycle ? computeScore(e.id, cycle.id) : 0;
    const total = cycle ? evaluations.filter((ev) => ev.employee_id === e.id && ev.cycle_id === cycle.id && ev.status === "active").length : 0;
    return { emp: e, score, rating: ratingFor(score), total };
  }).sort((a, b) => b.score - a.score);
  return (
    <div>
      <Field label="الدورة"><select style={s.input} value={cycleId} onChange={(e) => setCycleId(e.target.value)}>{cycles.map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}</select></Field>
      {!cycle ? <EmptyState icon={<Icon path={ICONS.file} size={28} />} title="لا توجد بيانات" body="أنشئ دورة تقييم أولًا." /> : (
        <>
          <Btn onClick={() => window.print()} style={{ marginBottom: 12 }}><Icon path={ICONS.print} size={15} /> طباعة / حفظ كـ PDF</Btn>
          <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
            {rows.map((r, i) => (
              <button key={r.emp.id} onClick={() => onOpenEmployee(r.emp.id)} style={s.rowCard}>
                <div style={s.rankBadge}>{i + 1}</div>
                <div style={{ flex: 1, textAlign: "right" }}><div style={{ fontWeight: 700, fontSize: 14 }}>{r.emp.name}</div><div style={{ fontSize: 12, color: "var(--ink-3)" }}>{r.emp.profession} · {r.total} تقييم</div></div>
                <div style={{ textAlign: "left" }}><div style={{ fontWeight: 800 }}>{Math.round(r.score)}</div><div style={{ fontSize: 11, color: "var(--ink-3)" }}>{r.rating}</div></div>
              </button>
            ))}
          </div>
        </>
      )}
    </div>
  );
}

/* ============================= سجل التدقيق ============================= */
function AuditLogScreen({ audit }) {
  if (!audit.length) return <EmptyState icon={<Icon path={ICONS.clipboard} size={28} />} title="لا يوجد سجل بعد" body="" />;
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
      {audit.map((a) => (
        <div key={a.id} style={{ padding: "10px 0", borderBottom: "0.5px solid var(--border)" }}>
          <div style={{ fontSize: 13 }}><b>{a.actor}</b> — {a.action}</div>
          {a.target && a.target !== "-" && <div style={{ fontSize: 12, color: "var(--ink-3)" }}>{a.target}</div>}
          <div style={{ fontSize: 11, color: "var(--ink-3)", marginTop: 2 }}>{fmtDateTime(a.created_at)}</div>
        </div>
      ))}
    </div>
  );
}

  modalOverlay: { position: "fixed", inset: 0, background: "rgba(20,18,14,0.45)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 50, padding: 16 },
