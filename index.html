<style>
  :root {
    --bg: #F7F4EC; --bg-2: #FFFFFF;
    --ink: #211E18; --ink-2: #4B463C; --ink-3: #8C8578; --ink-4: #C9C3B4;
    --border: #ECE7DB; --border-strong: #D6CFBD;
    --forest: #2E4635; --forest-10: #E4EAE3;
    --green: #3B6D24; --green-10: #E9F2E0;
    --red: #A6382C; --red-10: #F7E7E3;
    --gold: #C9A227; --gold-dark: #8A6A16; --gold-10: #F7EFD6;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); font-family: 'Tajawal', sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font-family: 'Tajawal', sans-serif; }
  button { transition: transform .12s ease, opacity .12s ease, box-shadow .12s ease; -webkit-user-select: none; user-select: none; }
  button:active { transform: scale(0.96); opacity: 0.88; }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--forest); box-shadow: 0 0 0 3px var(--forest-10); }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 6px; }
  .spin { animation: spin 0.8s linear infinite; display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spin-once { animation: spin .5s cubic-bezier(.4,0,.2,1); }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  @media print { .no-print { display: none !important; } }
  #root { max-width: 480px; margin: 0 auto; min-height: 100vh; background: var(--bg); }
</style>
</head>
